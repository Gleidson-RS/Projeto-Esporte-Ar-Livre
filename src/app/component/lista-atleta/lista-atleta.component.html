<section id="section-lista-Atleta">
    <h2>Lista Atletas</h2>
  
    @for(elem of listaAtletas(); track elem.id) {
      <div class="atleta-item">
        <span class="span-dados-atleta">
        ID do Usuario:  {{elem.id}}<br>
        Nome do Usuario:  {{ elem.nome }}<br>
        CPF:  {{ elem.cpf }}<br>
        Cidade:  {{elem.cidade }}<br>
        Estado:  {{ elem.uf }}<br>
        </span>
        <span class="span-lnk-atletas">

          <button><a class="Cadastro-Atleta/:id" (click)="carregaDadosAtletaForm(elem)">Alterar</a></button>

          <button><a class="lnk-atleta lnk-excluir" (click)="excluir(elem.id)">Excluir</a></button>

        </span>
      </div>
    }@empty{
      <div class="div-item-pessoa">
        NENHUM REGISTRO NA LISTA
      </div>
    }
  </section>
