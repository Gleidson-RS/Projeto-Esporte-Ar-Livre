<section id="form-inscricao">

    <h2>Inscrição na Corrida</h2>
  
    <form id="form-corrida">
  
      <div class="linha">
  
        <div class="campo campo-atleta">
          <label for="atleta">Atleta Cadastrado</label>
  
          <select id="atleta" name="atleta">
            <option value="">Selecione o atleta (ou digite o CPF)</option>
            <option value="1">João da Silva</option>
            <option value="2">Maria Souza</option>
          </select>
        </div>
  
        <div class="campo campo-cpf">
          <label for="cpf">Ou Buscar por CPF</label>
  
          <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="000.000.000-00">
        </div>
  
      </div>
  
  
      <div class="linha">
  
        <div class="campo campo-corrida">
          <label for="corrida">Corrida Escolhida</label>
  
          <select id="corrida" name="corrida">
            <option value="">
              Circuito das Estações - Etapa Verão (15/11/2026)
            </option>
          </select>
        </div>
  
        <div class="campo campo-distancia">
          <label>Distância da Prova</label>
  
          <div class="radios">
  
            <label>
              <input type="radio" name="distancia" value="5km">
              5km
            </label>
  
            <label>
              <input type="radio" name="distancia" value="10km">
              10km
            </label>
  
            <label>
              <input type="radio" name="distancia" value="25km">
              25km
            </label>
  
          </div>
        </div>
  
      </div>
  
  
      <div class="linha">
  
        <div class="campo campo-camisa">
          <label for="camisa">Tamanho da Camiseta (Kit)</label>
  
          <select id="camisa" name="camisa">
            <option value="">Selecione</option>
            <option value="P">P</option>
            <option value="M">M</option>
            <option value="G">G</option>
            <option value="GG">GG</option>
          </select>
        </div>
  
        <div class="campo campo-categoria">
          <label for="categoria">Categoria / Faixa Etária</label>
  
          <input
            type="text"
            id="categoria"
            name="categoria"
            value="Geral Masculino / 30-39 anos"
            readonly>
        </div>
  
      </div>
  
  
      <div class="valor-inscricao">
  
        <strong>Valor da Inscrição:</strong>
  
        <span>R$ 89,90</span>
  
      </div>
  
  
      <div class="termos">
  
        <input
          type="checkbox"
          id="termos"
          name="termos">
  
        <label for="termos">
          Li e aceito os termos do regulamento da prova e declaração de saúde.
        </label>
  
      </div>
  
  
      <button
        type="submit"
        class="btn-finalizar">
  
        Finalizar e Ir para Pagamento
  
      </button>
  
    </form>
  
  </section>
