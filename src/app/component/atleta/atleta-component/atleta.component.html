<section id="form">

    <h2> {{!editar ? 'Cadastrar' : 'Alterar'}} Atleta</h2>

    <form id="form-atleta" (ngSubmit)="salvar()">

        <label for="nome">Nome Completo*</label>

        <input
            type="text"
            name="nome"
            id="nome"
            class="input01"
            maxlength="60"
            placeholder="Digite seu nome completo"
            [(ngModel)]="nome"
        >

        <label for="dataNascimento"> Data* </label>
        <input type="date" name="dataNascimento" id="dataNascimento" class="input01" maxlength="60" placeholder="Digite seu data completo" [(ngModel)]="dataNascimento">

        <label for="cpf">CPF*</label>

        <input
            type="text"
            name="cpf"
            id="cpf"
            class="input02"
            maxlength="14"
            placeholder="Digite seu CPF"
            [(ngModel)]="cpf"
        >


        <label for="sexo">Sexo</label>

        <input
            type="radio"
            name="sexo"
            id="sexo-m"
            class="radio01"
            required
            [(ngModel)]="sexo"
            value="M"
        >

        Masculino


        <input
            type="radio"
            name="sexo"
            id="sexo-f"
            class="radio01"
            required
            [(ngModel)]="sexo"
            value="F"
        >

        Feminino


        <input
            type="radio"
            name="sexo"
            id="sexo-n"
            class="radio01"
            required
            [(ngModel)]="sexo"
            value="N"
        >

        Não declarar


        <label for="cep">CEP*</label>

        <input
            type="text"
            name="cep"
            id="cep"
            class="input02"
            maxlength="8"
            placeholder="Digite seu CEP completo"
            [(ngModel)]="cep"
        >


        <label for="rua-logradouro">Rua/Logradouro*</label>

        <input
            type="text"
            name="rua-logradouro"
            id="rua-logradouro"
            class="input01"
            maxlength="60"
            placeholder="Digite o nome do seu Rua/Logradouro"
            [(ngModel)]="ruaLogradouro"
        >


        <label for="bairro">Bairro*</label>

        <input
            type="text"
            name="bairro"
            id="bairro"
            class="input02"
            maxlength="60"
            placeholder="Digite o nome do seu bairro"
            [(ngModel)]="bairro"
        >


        <label for="cidade">Cidade*</label>

        <input
            type="text"
            name="cidade"
            id="cidade"
            class="input02"
            maxlength="60"
            placeholder="Digite o nome da sua cidade"
            [(ngModel)]="cidade"
        >


        <label for="uf">UF*</label>

        <input
            type="text"
            name="uf"
            id="uf"
            class="input02"
            maxlength="60"
            placeholder="Digite o nome do seu Estado"
            [(ngModel)]="uf"
        >


        <div id="div-btns">

            <button type="submit" id="btnAdd" > {{!editar ? 'Cadastrar' : 'Alterar'}} </button>

            <button type="reset" id="btnLimpar" (click)="limparDados()" >Limpar</button>

        </div>

    </form>

</section>
