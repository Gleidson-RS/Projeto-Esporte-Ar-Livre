<section id="section-lista-Atleta">

  <h2>Lista Atletas</h2>

  @for (elem of listaAtletas(); track elem.idpessoa) {

    <div class="atleta-item">

      <span class="span-dados-atleta">

        ID do Usuario: {{ elem.idpessoa }}<br>

        <ul>
          Nome do Usuario: {{ elem.nome }}
        </ul>

        Idade: {{ calcularIdade(elem.datanascimento) }} anos<br>

      </span>

      <span class="span-lnk-atletas">

        <button
          (click)="carregaDadosAtletaForm(elem)"
        >
          Alterar
        </button>

        <button
          class="lnk-atleta lnk-excluir"
          (click)="excluir(elem.idpessoa)"
        >
          Excluir
        </button>

      </span>

    </div>

  } @empty {

    <div class="div-item-pessoa">
      NENHUM REGISTRO NA LISTA
    </div>

  }

</section>
